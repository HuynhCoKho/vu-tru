```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vũ trụ - Huỳnh Cỏ Khô</title>
<meta name="description" content="Khám phá Vũ trụ - Huỳnh Cỏ Khô">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #10251f;
  color: #e7f5ed;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  padding: 30px;
}

.spinner {
  width: 42px;
  height: 42px;
  border: 4px solid #ffffff30;
  border-top-color: #a5e6c2;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

p { color: #c1d8cc; }
</style>
</head>

<body>

<div class="container">
  <div class="spinner"></div>
  <h2>Vũ trụ - Huỳnh Cỏ Khô</h2>
  <p>Đang kết nối ứng dụng...</p>
  <p>Nếu chưa tự động chuyển trang, hãy
    <a id="openApp" style="color:#a5e6c2" href="#">
      nhấn vào đây
    </a>.
  </p>
</div>

<script>

// LINK APPS SCRIPT
const APP_URL = 'https://script.google.com/macros/s/AKfycbzLVjFcbr7SZ1Nd6AUyWZsfRCE4DWlFQIddy1dLsOkwjoHuHzobBjhKBFb49Hw9Q6oy/exec';

// KIỂM TRA LINK
if (/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec\/?$/.test(APP_URL)) {

  document.getElementById('openApp').href = APP_URL;

  // CHUYỂN HƯỚNG TRỰC TIẾP
  window.location.replace(APP_URL);

} else {
  document.querySelector('.spinner').style.display = 'none';
  document.querySelector('p').textContent =
    'Đường dẫn Apps Script không hợp lệ.';
}

</script>

</body>
</html>
```
